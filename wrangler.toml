name = "cfmemos"
main = "worker/src/index.ts"
compatibility_date = "2025-05-01"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/file/*", "/u/*", "/explore/rss.xml"]

[vars]
INSTANCE_NAME = "cfmemos"
APP_VERSION = "1.0.0"

[[d1_databases]]
binding = "DB"
database_name = "memos-db"
database_id = "ec08e77a-fd1e-4f12-9327-142eab97e4f6"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cfmemos"

# Optional KV cache. Create a namespace with:
#   wrangler kv namespace create cfmemos-cache
# Then uncomment this block and replace the id.
[[kv_namespaces]]
binding = "CACHE"
id = "3b729feb97144c19b86bcde13be655e7"

[ai]
binding = "AI"
